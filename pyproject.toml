[project]
name = "hackathon"
version = "0.1.0"
description = "Hackathon PoC for Saga point cloud data"
requires-python = ">=3.11"

dependencies = [
    "boto3>=1.35.0",
    "pandas>=2.2.0",
    "pyarrow>=18.0.0",
    "python-dotenv>=1.0.1",
    "laspy[lazrs]>=2.5.4",
    "numpy>=2.0.0",
    "pyproj>=3.7.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0"
]

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]